name: ${COMPOSE_PROJECT_NAME:-air_gap_claude_code_external}

services:
  claude:
    image: claude
    build:
      context: .
      dockerfile: Dockerfile.claude
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: ${CLAUDE_CONTAINER_NAME:-claude}
    restart: unless-stopped
    # Linux 호스트에서 host.docker.internal 해석을 위해 host-gateway 매핑
    #   (macOS/Windows Docker Desktop 은 자동 제공되나 명시해도 무해)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ~/df:/home/ubuntu/df
      - claude-home:/home/ubuntu
    environment:
      - ANTHROPIC_BASE_URL=http://${OLLAMA_HOST:-host.docker.internal}:${OLLAMA_PORT_EXT:-11434}
      - ANTHROPIC_AUTH_TOKEN=ollama
      - ANTHROPIC_MODEL=${OLLAMA_MODEL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OLLAMA_HOST=${OLLAMA_HOST:-host.docker.internal}
      - OLLAMA_PORT_EXT=${OLLAMA_PORT_EXT:-11434}
      - CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1
      - TZ=${TZ:-Asia/Seoul}
    tty: true
    stdin_open: true

volumes:
  claude-home:
