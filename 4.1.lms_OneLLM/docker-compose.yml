name: ${COMPOSE_PROJECT_NAME:-air_gap_claude_code_lms_one}

services:
  lms:
    image: lms
    build:
      context: .
      dockerfile: Dockerfile.lms
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: ${LMS_CONTAINER_NAME:-lms}
    restart: unless-stopped
    environment:
      - LMS_MODEL=${LMS_MODEL}
      - LMS_PORT=${LMS_PORT:-1234}
      - LMS_HEALTH_TRIES=${LMS_HEALTH_TRIES:-30}
      - LMS_CONTEXT_LENGTH=${LMS_CONTEXT_LENGTH:-32768}
      - LMS_GPU=${LMS_GPU:-max}
      - LMS_PARALLEL=${LMS_PARALLEL:-1}
      - TZ=${TZ:-Asia/Seoul}
    ports:
      # 호스트/외부(Windows) 클라이언트 접속용 publish.
      #   LMS_BIND_HOST=127.0.0.1(기본) → 호스트 내부만 / 0.0.0.0 → LAN(Windows 클라이언트) 허용
      - "${LMS_BIND_HOST:-127.0.0.1}:${LMS_PORT:-1234}:${LMS_PORT:-1234}"
    volumes:
      # 모델 저장소 토글: LMS_MODEL_MOUNT 가 비면 named volume, 지정하면 호스트 디렉토리 공유
      - ${LMS_MODEL_MOUNT:-lms-models}:/home/lms/.lmstudio/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${LMS_PORT:-1234}/v1/models"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks:
      - lms

  claude:
    image: claude
    build:
      context: .
      dockerfile: Dockerfile.claude
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: ${CLAUDE_CONTAINER_NAME:-claude}
    restart: unless-stopped
    depends_on:
      lms:
        condition: service_healthy
    volumes:
      - ~/df:/home/ubuntu/df
      - claude-home:/home/ubuntu
    environment:
      # LMS OpenAI 엔드포인트 직결 (변환 게이트웨이 없음)
      - ANTHROPIC_BASE_URL=http://${LMS_CONTAINER_NAME:-lms}:${LMS_PORT:-1234}
      - ANTHROPIC_AUTH_TOKEN=lms
      - ANTHROPIC_MODEL=${LMS_MODEL}
      - LMS_HOST=${LMS_CONTAINER_NAME:-lms}
      - LMS_PORT=${LMS_PORT:-1234}
      - LMS_MODEL=${LMS_MODEL}
      - API_TIMEOUT_MS=${API_TIMEOUT_MS:-600000}
      - CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1
      - TZ=${TZ:-Asia/Seoul}
    tty: true
    stdin_open: true
    networks:
      - lms

volumes:
  claude-home:
  lms-models:

networks:
  lms:
    name: ${LMS_NETWORK_NAME:-lms}
